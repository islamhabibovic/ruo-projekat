- name: BIND 9
  ansible.builtin.apt:
    name: [bind9, bind9-utils]
    state: present
    cache_valid_time: 3600

# AO-9: TSIG ključ se generiše na serveru pri prvom pokretanju i nikad nije u Gitu.
# "creates" čini zadatak idempotentnim: postojeći ključ se ne mijenja.
- name: TSIG ključ za Terraform (generiše se samo ako ne postoji)
  ansible.builtin.shell: "tsig-keygen -a hmac-sha256 {{ bind_tsig_kljuc }} > {{ bind_tsig_datoteka }}"
  args:
    creates: "{{ bind_tsig_datoteka }}"
  notify: reload named

- name: Prava nad TSIG ključem (čita ga samo named)
  ansible.builtin.file:
    path: "{{ bind_tsig_datoteka }}"
    owner: root
    group: bind
    mode: "0640"

- name: Direktorij za statičke zone
  ansible.builtin.file: { path: /etc/bind/zones, state: directory, owner: root, group: bind, mode: "0755" }

- name: Opcije servera (samo autoritativni, bez rekurzije)
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: reload named

- name: Zone projekta
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: reload named

- name: Reverzna zona (statička, upravlja Ansible)
  ansible.builtin.template:
    src: db.reverzna.j2
    dest: "{{ bind_rev_datoteka }}"
    owner: root
    group: bind
    mode: "0644"
    validate: "named-checkzone {{ bind_rev_zona }} %s"
  notify: reload named

# Dinamičku zonu mijenja Terraform (RFC 2136); BIND sam piše u datoteku i journal.
# force: false = Ansible je pravi samo prvi put i nikad ne prepisuje zapise koje je dodao Terraform.
- name: Početni sadržaj dinamičke zone (SOA, NS, ns1)
  ansible.builtin.template:
    src: db.zona.j2
    dest: "{{ bind_dinamicka_zona }}"
    owner: bind
    group: bind
    mode: "0644"
    force: false
    validate: "named-checkzone {{ zona }} %s"
  notify: reload named

- name: Provjera cijele konfiguracije (named-checkconf -z)
  ansible.builtin.command: named-checkconf -z
  changed_when: false

- name: named radi i pokreće se pri boot-u
  ansible.builtin.service: { name: named, state: started, enabled: true }

- name: Primijeni izmjene konfiguracije prije nastavka
  ansible.builtin.meta: flush_handlers

- name: Pročitaj TSIG ključ
  ansible.builtin.slurp: { src: "{{ bind_tsig_datoteka }}" }
  register: tsig_datoteka
  no_log: true

- name: Lokalni direktorij za tajne (izvan Gita)
  ansible.builtin.file:
    path: "{{ bind_tsig_lokalno | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: TSIG tajna za terraform/dns (lokalno, 0600)
  ansible.builtin.copy:
    dest: "{{ bind_tsig_lokalno }}"
    content: "{{ (tsig_datoteka.content | b64decode | regex_search('secret \"([^\"]+)\"', '\\1')) | first }}\n"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
