# Repozitorij mora biti u Linux fajl sistemu (u WSL2: ~/..., ne /mnt/c/...), inače Ansible ignoriše ovaj fajl.
[defaults]
inventory = inventory.ini
roles_path = roles
vault_password_file = ../.vault_pass
interpreter_python = auto_silent
host_key_checking = False
retry_files_enabled = False

[ssh_connection]
# VM-ovi se ponovo kreiraju s istim adresama, pa se ključevi hosta ne pamte
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o LogLevel=ERROR
pipelining = True
