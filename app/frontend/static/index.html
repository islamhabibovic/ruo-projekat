<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilješke · troslojna aplikacija</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    h1 { font-size: 1.4rem; margin-bottom: .2rem; }
    p.opis { color: #52606d; margin-top: 0; }
    form { display: flex; gap: .5rem; margin: 1.5rem 0; }
    input { flex: 1; padding: .55rem; border: 1px solid #cbd2d9; border-radius: 6px; }
    button { padding: .55rem 1rem; border: 0; border-radius: 6px; background: #2457a6; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid #e4e7eb; }
    li small { color: #7b8794; }
    li button { background: none; color: #b42318; padding: 0; }
    #status { font-size: .85rem; color: #52606d; }
  </style>
</head>
<body>
  <h1>Bilješke</h1>
  <p class="opis">frontend (nginx) → backend (Flask) → baza (PostgreSQL)</p>
  <div id="status">provjera backenda…</div>
  <form id="forma">
    <input id="tekst" maxlength="500" placeholder="Nova bilješka" required>
    <button>Dodaj</button>
  </form>
  <ul id="lista"></ul>
  <script>
    const lista = document.getElementById('lista');
    const status = document.getElementById('status');

    async function ucitaj() {
      const r = await fetch('/api/biljeske');
      const podaci = await r.json();
      lista.replaceChildren(...podaci.map(b => {
        const li = document.createElement('li');
        const tekst = document.createElement('span');
        tekst.textContent = b.tekst;
        const meta = document.createElement('small');
        meta.textContent = new Date(b.kreirano).toLocaleString('bs');
        const btn = document.createElement('button');
        btn.textContent = 'obriši';
        btn.onclick = async () => { await fetch('/api/biljeske/' + b.id, { method: 'DELETE' }); ucitaj(); };
        const lijevo = document.createElement('div');
        lijevo.append(tekst, document.createElement('br'), meta);
        li.append(lijevo, btn);
        return li;
      }));
    }

    document.getElementById('forma').onsubmit = async e => {
      e.preventDefault();
      const polje = document.getElementById('tekst');
      await fetch('/api/biljeske', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tekst: polje.value })
      });
      polje.value = '';
      ucitaj();
    };

    fetch('/api/health/db').then(r => r.json()).then(s => {
      status.textContent = s.status === 'ok' ? 'baza: ' + s.baza + ' ✓' : 'baza nedostupna';
    }).catch(() => { status.textContent = 'backend nedostupan'; });
    ucitaj();
  </script>
</body>
</html>
